spring.application.name=review-moderation
spring.datasource.url=jdbc:h2:mem:reviewsdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# Keep this false: entities returned from repositories are detached, so changes must be saved explicitly.
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
